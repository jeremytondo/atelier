# Anaconda's settings for installing Atelier for Linux, added to the installer
# as an updates image.

[Storage]
# Automatic partitioning lays out an EFI partition, /boot and one XFS root:
# the layout of Fedora's bootc docs, the image's qcow2 and `bootc install`.
# Fedora's default is btrfs, whose root options in /etc/fstab can't be applied
# to the composefs root, so systemd-remount-fs fails at every boot.
default_scheme = PLAIN
file_system_type = xfs
default_partitioning =
    /     (min 10 GiB)
