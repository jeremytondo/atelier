# Tasks are named after the part of Atelier they belong to: linux: for the
# image in linux/, core: for the Atelier core in core/.

[tools]
# The core's Go, matching core/go.mod.
go = "1.26.7"

[tasks."linux:build"]
description = "Build the image locally as localhost/atelier-linux:local (runs bootc container lint)"
run = "$(command -v podman || command -v docker) build --file linux/Containerfile --tag localhost/atelier-linux:local linux"

[tasks."linux:boot-test"]
description = "Boot a qcow2 in qemu with cloud-init and check it: mise run linux:boot-test <qcow2>"
run = "linux/scripts/boot-test"

[tasks."linux:release:patch"]
description = "Dispatch the Linux release workflow to cut a patch release"
run = "gh workflow run linux-release.yml -f bump=patch"

[tasks."linux:release:minor"]
description = "Dispatch the Linux release workflow to cut a minor release"
run = "gh workflow run linux-release.yml -f bump=minor"

[tasks."linux:release:major"]
description = "Dispatch the Linux release workflow to cut a major release"
run = "gh workflow run linux-release.yml -f bump=major"

[tasks."linux:release:dev"]
description = "Rebuild :dev from main (pass --ref <branch> to build a pushed branch)"
run = "gh workflow run linux-release.yml -f bump=dev"

[tasks."core:build"]
description = "Build atelier into core/bin/atelier"
dir = "{{config_root}}/core"
run = "CGO_ENABLED=0 go build -o bin/atelier ./cmd/atelier"

[tasks."core:test"]
description = "Vet the core and run its tests with the race detector"
dir = "{{config_root}}/core"
run = ["go vet ./...", "go test -race ./..."]

[tasks."core:release:patch"]
description = "Dispatch the Core release workflow to cut a patch release"
run = "gh workflow run core-release.yml -f bump=patch"

[tasks."core:release:minor"]
description = "Dispatch the Core release workflow to cut a minor release"
run = "gh workflow run core-release.yml -f bump=minor"

[tasks."core:release:major"]
description = "Dispatch the Core release workflow to cut a major release"
run = "gh workflow run core-release.yml -f bump=major"
