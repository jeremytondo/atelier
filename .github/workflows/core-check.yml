name: Core check

# Vets, tests and builds the core on pull requests and pushes to main that
# touch it.

on:
  pull_request:
    paths:
      - core/**
      - mise.toml
      - .github/workflows/core-check.yml
  push:
    branches: [main]
    paths:
      - core/**
      - mise.toml
      - .github/workflows/core-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
      - run: mise run core:test
      - run: mise run core:build
      - name: Check formatting
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted: $unformatted"
            exit 1
          fi
